<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR scan effect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0b;
  --panel: #111113;
  --raise: #1a1a1d;
  --raise2: #232327;
  --line: #1f1f23;
  --line2: #2c2c31;
  --text: #f0efed;
  --mute: #8a8890;
  --accent: #ff8aa5;
  --accent-dim: #f27795;
  --warn: #f0b36a;
  --danger: #ff7b7b;
  --ease: cubic-bezier(.32, .72, 0, 1);
  --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.45; letter-spacing: -.005em; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- shell ---------- */
.bar { height: 52px; display: flex; align-items: center; gap: 20px; padding: 0 20px; border-bottom: 1px solid var(--line); }
.brand { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.fileinfo { color: var(--mute); font-size: 12.5px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note { color: var(--mute); font-size: 12.5px; white-space: nowrap; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: calc(100vh - 52px); }
.work { display: flex; flex-direction: column; min-height: 0; min-width: 0; padding: 14px 16px 14px 20px; }
.side { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.side-scroll { flex: 1; overflow-y: auto; min-height: 0; padding: 16px 20px 8px; scrollbar-width: thin; scrollbar-color: #2c2c31 transparent; }

/* ---------- buttons, switch, range ---------- */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.tgroup { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn { background: var(--raise); border: 0; border-radius: 8px; padding: 0 12px; height: 32px; font-size: 13px; font-weight: 500; color: var(--text); transition: background .15s; }
.btn:hover:not(:disabled) { background: var(--raise2); }
.btn:disabled { color: #55535a; cursor: default; background: #151517; }
.btn.primary { background: var(--accent); color: #1a0d12; font-weight: 600; height: 46px; border-radius: 12px; font-size: 15px; width: 100%; }
.btn.primary:hover:not(:disabled) { background: var(--accent-dim); }
.btn.primary:disabled { background: #1d1d20; color: #5f5d64; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.zoomtxt { color: var(--mute); font-size: 12.5px; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .tr { width: 38px; height: 22px; border-radius: 11px; background: #3a3a40; position: relative; flex: none; transition: background .25s var(--ease); }
.switch .tr::after { content: ""; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .45); transition: transform .28s var(--ease); }
.switch input:checked + .tr { background: var(--accent); }
.switch input:checked + .tr::after { transform: translateX(16px); }
.switch input:focus-visible + .tr { outline: 2px solid var(--accent); outline-offset: 2px; }

input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; width: 100%; min-width: 0; height: 20px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p, 0%), #2c2c31 var(--p, 0%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; margin-top: -6px; box-shadow: 0 1px 4px rgba(0, 0, 0, .55); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: #2c2c31; }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: #fff; }
input[type=range]:disabled { opacity: .4; cursor: default; }

.seg { position: relative; display: flex; background: var(--raise); border-radius: 9px; padding: 2px; --i: 0; --n: 2; }
.seg::before { content: ""; position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / var(--n)); transform: translateX(calc(var(--i) * 100%)); background: #3b3b41; border-radius: 7px; box-shadow: 0 1px 2px rgba(0, 0, 0, .45); transition: transform .3s var(--ease); }
.seg button { position: relative; z-index: 1; flex: 1; min-width: 0; background: none; border: 0; border-radius: 7px; padding: 6px 4px; font-size: 13px; font-weight: 500; color: var(--mute); white-space: nowrap; transition: color .2s; }
.seg button:hover:not(:disabled) { color: var(--text); }
.seg button[aria-checked=true] { color: #fff; }
.seg button:disabled { color: #4a484f; cursor: default; }

/* ---------- stage ---------- */
.stage { position: relative; flex: 1; min-height: 0; background: #060607; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage canvas.main { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: none; }
.stage.has-img canvas.main { display: block; }
.drop { position: absolute; inset: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; color: var(--mute); border: 1px dashed var(--line2); border-radius: 10px; padding: 24px; transition: border-color .2s, color .2s; }
.stage.has-img .drop { display: none; }
.stage.dragover .drop { border-color: var(--accent); color: var(--text); }
.drop svg { margin-bottom: 10px; }
.drop strong { color: var(--text); font-weight: 500; font-size: 17px; letter-spacing: -.01em; }
.drop .btn { margin-top: 14px; }
#loupe { position: absolute; top: 14px; width: 132px; height: 132px; border: 1px solid #3a3a40; border-radius: 12px; background: #000; pointer-events: none; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); }
.status { margin: 10px 0 0; min-height: 20px; font-size: 13px; color: var(--mute); }
.status.ok { color: var(--text); }
.status.warn { color: var(--warn); }

/* ---------- side panel ---------- */
.prev-wrap { position: relative; display: flex; justify-content: center; background: #060607; border: 1px solid var(--line); border-radius: 14px; padding: 14px 0; margin-top: 14px; }
.prev-wrap canvas { height: min(44vh, 500px); aspect-ratio: 9 / 16; max-width: 100%; display: block; background: #000; border-radius: 10px; }
.prev-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--mute); text-align: center; padding: 24px; font-size: 13px; }
.prev-wrap.ready .prev-empty { display: none; }
.prev-wrap:not(.ready) canvas { visibility: hidden; }
.player { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.player .btn { min-width: 64px; }
.phases { position: relative; height: 16px; margin: 0 0 0 76px; color: var(--mute); font-size: 11px; }
.phases span { position: absolute; white-space: nowrap; }
.result { margin-top: 14px; }
.result video { width: 100%; max-height: 60vh; background: #000; display: block; border-radius: 14px; }
.result .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.result .row span { color: var(--mute); font-size: 12.5px; }
.result .btn.primary { width: auto; height: 38px; padding: 0 20px; font-size: 14px; border-radius: 10px; }

.group { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 16px 14px; }
.field { min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.lbl { display: block; font-size: 12px; color: var(--mute); margin-bottom: 7px; }
.rangerow { display: flex; align-items: center; gap: 12px; }
.rangerow output { width: 34px; text-align: right; color: var(--mute); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.labelrow { margin-top: 10px; }
input[type=text] { background: var(--raise); border: 1px solid transparent; border-radius: 9px; padding: 8px 11px; width: 100%; min-width: 0; font-size: 13px; transition: border-color .15s; }
input[type=text]:hover { border-color: var(--line2); }
input[type=text]:focus { outline: none; border-color: var(--accent); }

.make { border-top: 1px solid var(--line); padding: 14px 20px 16px; background: var(--panel); }
.row2 { display: flex; gap: 8px; }
.row2 .btn:not(.primary) { white-space: nowrap; height: 46px; border-radius: 12px; }
.progress { margin-top: 12px; }
.bar-track { height: 4px; border-radius: 2px; background: var(--raise); overflow: hidden; }
.bar-track i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; }
.progress span { display: block; margin-top: 7px; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
.err { margin: 10px 0 0; color: var(--danger); font-size: 13px; }
.err:empty { display: none; }

@media (max-width: 1000px) {
  .app { display: block; height: auto; }
  .bar .note { display: none; }
  .work { padding: 12px 14px; }
  .stage { flex: none; height: 62vh; min-height: 340px; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  .side-scroll { overflow: visible; }
  .prev-wrap canvas { height: min(60vh, 520px); }
  .make { position: sticky; bottom: 0; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">QR scan</div>
  <div class="fileinfo" id="fileInfo"></div>
  <div class="note">Runs in this page. Nothing is uploaded or saved.</div>
</header>

<main class="app">
  <section class="work">
    <div class="toolbar">
      <div class="tgroup">
        <label class="switch"><input type="checkbox" id="autoFit" checked><span class="tr"></span>Auto-fit to the QR</label>
        <button class="btn" id="fitBtn" disabled>Fit now</button>
        <button class="btn" id="clearBtn" disabled>Clear</button>
      </div>
      <div class="tgroup">
        <span class="zoomtxt" id="zoomTxt"></span>
        <button class="btn" id="zoomBtn" disabled>Reset zoom</button>
        <button class="btn" id="newBtn" disabled>New photo</button>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="drop">
        <svg width="52" height="52" viewBox="0 0 52 52" fill="none" stroke="#8a8890" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 18V12a8 8 0 0 1 8-8h6M34 4h6a8 8 0 0 1 8 8v6M48 34v6a8 8 0 0 1-8 8h-6M18 48h-6a8 8 0 0 1-8-8v-6"/></svg>
        <strong>Drop a photo here</strong>
        <span>or paste it with Ctrl+V</span>
        <button class="btn" id="pickBtn" type="button">Choose a file</button>
      </div>
      <canvas class="main" id="markCv"></canvas>
      <canvas id="loupe" width="132" height="132" hidden></canvas>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <p class="status" id="markHint">Any size or ratio works.</p>
  </section>

  <aside class="side">
    <div class="side-scroll">
      <div class="seg" id="tabs" role="radiogroup" aria-label="View"><button data-v="prev">Preview</button><button data-v="vid" disabled>Video</button></div>

      <div id="viewPrev">
        <div class="prev-wrap" id="prevWrap">
          <canvas id="prevCv" width="540" height="960"></canvas>
          <div class="prev-empty">Mark the QR and the animation shows up here.</div>
        </div>
        <div class="player">
          <button class="btn" id="playBtn" disabled>Pause</button>
          <input type="range" id="scrub" min="0" max="1000" value="0" disabled aria-label="Position">
        </div>
        <div class="phases" id="phases"></div>
      </div>
      <div id="viewVid" class="result" hidden>
        <video id="vid" controls playsinline loop></video>
        <div class="row"><span id="meta"></span><a class="btn primary" id="dl" download="qr-scan.mp4">Download</a></div>
      </div>

      <div class="group">
        <div class="field"><span class="lbl">Frame rate</span>
          <div class="seg" id="fps" role="radiogroup" aria-label="Frame rate"><button data-v="30">30</button><button data-v="60">60</button></div></div>
        <div class="field"><span class="lbl">Speed</span>
          <div class="seg" id="speed" role="radiogroup" aria-label="Speed"><button data-v="0.8">Slow</button><button data-v="1">Normal</button><button data-v="1.25">Fast</button></div></div>
        <div class="field"><span class="lbl">Photo</span>
          <div class="seg" id="place" role="radiogroup" aria-label="Photo placement"><button data-v="fit">Whole</button><button data-v="fill">Fill</button></div></div>
        <div class="field"><span class="lbl">Ending</span>
          <div class="seg" id="ending" role="radiogroup" aria-label="Ending"><button data-v="flash">Flash</button><button data-v="zoom">Zoom in</button><button data-v="cut">Cut</button></div></div>
        <div class="field"><span class="lbl">Scanner frame</span>
          <div class="seg" id="frame" role="radiogroup" aria-label="Scanner frame"><button data-v="round">Round</button><button data-v="square">Square</button><button data-v="off">None</button></div></div>
        <div class="field"><span class="lbl">QR corner roundness</span>
          <div class="rangerow"><input type="range" id="round" min="0" max="20" value="6" aria-label="Corner roundness"><output id="roundOut">6%</output></div></div>
        <div class="field wide">
          <label class="switch"><input type="checkbox" id="labelOn"><span class="tr"></span>Small label under the QR</label>
          <div class="labelrow" id="labelRow" hidden><input type="text" id="labelText" value="Opening your gift" maxlength="30" aria-label="Label text"></div>
        </div>
      </div>
    </div>

    <div class="make">
      <div class="row2">
        <button class="btn primary" id="startBtn" disabled>Make video</button>
        <button class="btn" id="cancelBtn" hidden>Cancel</button>
      </div>
      <div class="progress" id="prog" hidden><div class="bar-track"><i id="barFill"></i></div><span id="progTxt"></span></div>
      <p class="err" id="err" role="alert"></p>
    </div>
  </aside>
</main>

  sx.fillStyle = '#000';
  [[100, 44, .34], [34, 14, .3], [7, 2, .34]].forEach(s => {
    sx.shadowColor = 'rgba(0,0,0,' + s[2] + ')'; sx.shadowBlur = s[0] * k; sx.shadowOffsetY = s[1] * k;
    squircle(sx, sm, sm, tw, th, rad); sx.fill();
  });

  const T = timeline(o.ending);
  return { W, H, k, o, T, base, hole, blurred, vig, card, shadow, sm, q, tw, th, rad, target: { cx: W / 2, cy: H * 0.44 }, end: T.end / o.speed };
}

const WHITE = [255, 255, 255], PINK = [255, 138, 165];
const mixRGB = (a, b, t) => 'rgb(' + a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',') + ')';
// Scanner corners that hug the card. "round": the curve runs concentric with the card's
// own corners (like the iPhone camera's frame). "square": plain sharp corners.
// The round corner is the card's own corner curve pushed outward by `gap` along its normal,
// point by point, so the frame stays exactly the same distance from the card all the way round
// (a plain circular arc does not match a squircle corner).
function offsetCorner(r, gap, steps) {
  const e = 2 / SQ_N, pts = [];
  r = Math.max(r, 0.01);
  for (let i = 0; i <= steps; i++) {
    const a = Math.PI + (i / steps) * Math.PI / 2, co = Math.cos(a), si = Math.sin(a);
    const u = Math.sign(co) * Math.pow(Math.abs(co), e), v = Math.sign(si) * Math.pow(Math.abs(si), e);
    let nx = Math.sign(u) * Math.pow(Math.abs(u), SQ_N - 1), ny = Math.sign(v) * Math.pow(Math.abs(v), SQ_N - 1);
    const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
    pts.push([r + r * u + gap * nx, r + r * v + gap * ny]);   // relative to the card's top-left corner
  }
  return pts;
}
function drawBrackets(c, x, y, w, h, len, gap, rEff, lw, alpha, style) {
  if (style === 'off') return;
  const sq = style === 'square';
  c.save(); c.globalAlpha = alpha; c.strokeStyle = '#fff'; c.lineWidth = lw;
  c.lineCap = sq ? 'butt' : 'round'; c.lineJoin = sq ? 'miter' : 'round';
  if (sq) {
    const x0 = x - gap, y0 = y - gap, x1 = x + w + gap, y1 = y + h + gap;
    [[x0, y0, 1, 1], [x1, y0, -1, 1], [x0, y1, 1, -1], [x1, y1, -1, -1]].forEach(p => {
      c.beginPath(); c.moveTo(p[0] + p[2] * len, p[1]); c.lineTo(p[0], p[1]); c.lineTo(p[0], p[1] + p[3] * len); c.stroke();
    });
  } else {
    const r = Math.min(rEff, w / 2, h / 2), pts = offsetCorner(r, gap, 28);
    // the same top-left corner, mirrored into the other three, so all four are identical
    [[1, 1], [-1, 1], [1, -1], [-1, -1]].forEach(m => {
      const X = px => x + (m[0] > 0 ? px : w - px), Y = py => y + (m[1] > 0 ? py : h - py);
      c.beginPath(); c.moveTo(X(-gap), Y(r + len));
      pts.forEach(p => c.lineTo(X(p[0]), Y(p[1])));
      c.lineTo(X(r + len), Y(-gap)); c.stroke();
    });
  }
  c.restore();
}
function drawHeart(c, cx, cy, s, color) {
  c.save(); c.translate(cx, cy); c.scale(s, s); c.fillStyle = color; c.beginPath();
  c.moveTo(0, .9); c.bezierCurveTo(-1.5, -.1, -.9, -1.1, 0, -.4); c.bezierCurveTo(.9, -1.1, 1.5, -.1, 0, .9); c.fill(); c.restore();
}

function drawFrame(c, S, tReal) {
  const { W, H, k, o, T } = S;
  const t = tReal * o.speed;                            // time on the normal-speed timeline
  const liftLin = seg01(t, T.lift0, T.lift1), lift = E.lift(liftLin), soft = E.inOut(liftLin);
  // the photo drifts closer, then steps back as the card comes forward (depth), then keeps drifting
  const z = t < T.lift0 ? lerp(1, 1.012, seg01(t, 0, T.lift0)) : lerp(1.012, 0.965, lift) + 0.02 * E.inOut(seg01(t, T.lift1, T.end));
  const zoomOut = o.ending === 'zoom' ? E.in(seg01(t, T.out0, T.out1)) : 0;

  c.setTransform(1, 0, 0, 1, 0, 0);
  c.imageSmoothingQuality = 'low';                      // full-screen layers: cheap filtering (the slow 'high' is for the small card only)
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  c.save();
  c.translate(W / 2, H / 2); c.scale(z, z); c.translate(-W / 2, -H / 2);
  if (soft < 1) c.drawImage(liftLin > 0 ? S.hole : S.base, 0, 0);
  if (liftLin > 0) { c.globalAlpha = soft; c.drawImage(S.blurred, 0, 0); c.globalAlpha = 1; }
  c.restore();
  if (liftLin > 0) {
    c.fillStyle = 'rgba(9,7,12,' + (0.4 * soft) + ')'; c.fillRect(0, 0, W, H);
    c.globalAlpha = soft; c.drawImage(S.vig, 0, 0); c.globalAlpha = 1;
  }

  // the QR card
  const q = S.q;
  const scx = W / 2 + (q.x + q.w / 2 - W / 2) * z, scy = H / 2 + (q.y + q.h / 2 - H / 2) * z;
  const cxm = lerp(scx, S.target.cx, lift), cym = lerp(scy, S.target.cy, lift);
  const f = 1 + 2.4 * zoomOut;
  const w = lerp(q.w * z, S.tw, lift) * f, h = lerp(q.h * z, S.th, lift) * f;
  const x = cxm - w / 2, y = cym - h / 2, sf = w / S.tw;
  if (liftLin > 0) {
    c.globalAlpha = lift * (1 - zoomOut);
    c.drawImage(S.shadow, cxm - (S.tw / 2 + S.sm) * sf, cym - (S.th / 2 + S.sm) * sf, (S.tw + 2 * S.sm) * sf, (S.th + 2 * S.sm) * sf);
    c.globalAlpha = 1;
  }
  c.imageSmoothingQuality = 'high';
  c.drawImage(S.card, x, y, w, h);

  // scanner brackets and the scan line
  const outFade = 1 - seg01(t, T.out0, T.out0 + .2);
  const brA = E.glide(seg01(t, T.br0, T.br0 + .55)) * outFade;
  if (brA > 0) {
    // they drop in from just outside, land close to the card, then ease in tight when the scan is done
    // (during the scan they stay loose, 30 out, so the lock that follows is a clear, visible closing-in to 8)
    // first move (arriving): slow and smooth. Second move (the lock): shorter and snappier, a quick keyframe-style close
    const gap = t < T.lock0 ? lerp(56 * k, 30 * k, E.glide(seg01(t, T.br0, T.br1))) : lerp(30 * k, 8 * k, E.settle(seg01(t, T.lock0, T.lock1)));
    // the card's corner is a squircle drawn at 1.2 x its radius: the frame follows that, so the four corners sit the same distance from it
    drawBrackets(c, x, y, w, h, Math.min(w, h) * 0.13, gap, Math.min(S.rad * SQ_K, S.tw / 2, S.th / 2) * sf, 3.6 * k, brA, o.frame);
  }
  if (t > T.scan0 && t < T.scan1 + .02) {
    // one continuous sine-shaped sweep, top to bottom and back: it slows to a stop at each end and
    // speeds up through the middle, with no seam where it turns around
    const u = seg01(t, T.scan0, T.scan1), wave = Math.sin(2 * Math.PI * u);
    const pos = (1 - Math.cos(2 * Math.PI * u)) / 2, dirDown = wave >= 0;
    const ly = y + h * pos, band = h * 0.26, fade = Math.min(seg01(u, 0, .1), 1 - seg01(u, .9, 1));
    const trail = Math.min(1, Math.abs(wave) * 2.2);              // the glow behind the line fades out and in again as it turns
    c.save();
    squircle(c, x, y, w, h, S.rad * sf); c.clip();
    const y0 = dirDown ? ly - band : ly, y1 = dirDown ? ly : ly + band;
    const g = c.createLinearGradient(0, dirDown ? y0 : y1, 0, dirDown ? y1 : y0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.6, 'rgba(255,255,255,.1)'); g.addColorStop(1, 'rgba(255,255,255,.3)');
    c.globalAlpha = fade * trail; c.fillStyle = g; c.fillRect(x, y0, w, y1 - y0);
    const lg = c.createLinearGradient(x, 0, x + w, 0);          // the line itself tapers to nothing at both ends
    lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.14, 'rgba(255,255,255,.95)'); lg.addColorStop(.86, 'rgba(255,255,255,.95)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
    c.globalAlpha = fade; c.fillStyle = lg; c.fillRect(x, ly - 1.25 * k, w, 2.5 * k);
    c.restore();
  }

  // optional label
  if (o.label) {
    const la = E.out(seg01(t, T.lab0, T.lab1)) * outFade;
    if (la > 0) {
      c.save(); c.globalAlpha = la;
      const fs = 28 * k; c.font = '600 ' + fs + 'px "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif';
      const tw = c.measureText(o.label).width, padX = 26 * k, hh = 62 * k, hs = 10 * k;
      const pw = tw + padX * 2 + hs * 2 + 12 * k, py = y + h + 46 * k + (1 - la) * 12 * k;
      roundRectPath(c, W / 2 - pw / 2, py, pw, hh, hh / 2);
      c.fillStyle = 'rgba(22,20,26,.8)'; c.fill(); c.strokeStyle = 'rgba(255,255,255,.14)'; c.lineWidth = 1.5 * k; c.stroke();
      drawHeart(c, W / 2 - pw / 2 + padX + hs, py + hh / 2, hs, '#ff7a9a');
      c.fillStyle = '#fff'; c.textBaseline = 'middle'; c.textAlign = 'left';
      c.fillText(o.label, W / 2 - pw / 2 + padX + hs * 2 + 12 * k, py + hh / 2 + 1 * k);
      c.restore();
    }
  }

  // the ending
  if (o.ending === 'flash') {
    const fa = E.in(seg01(t, T.out0, T.out1));
    if (fa > 0) { c.fillStyle = 'rgba(255,255,255,' + fa + ')'; c.fillRect(0, 0, W, H); }
  } else if (o.ending === 'zoom') {
    const fa = E.in(seg01(t, T.out0 + .25, T.out1));
    if (fa > 0) { c.fillStyle = 'rgba(255,255,255,' + fa + ')'; c.fillRect(0, 0, W, H); }
  }
}

/* ---------------------------------------------------------------- preview */
let rebuildTimer = 0;
function refreshPreview() {
  clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(() => {
    cancelAnimationFrame(raf);
    const ready = !!(img && mark);
    $('prevWrap').classList.toggle('ready', ready);
    $('playBtn').disabled = !ready; $('scrub').disabled = !ready; $('startBtn').disabled = !ready || rendering;
    if (!ready) { scene = null; $('phases').innerHTML = ''; return; }
    scene = prepare(540, 960, options());
    drawPhases();
    playOffset = 0; playT0 = performance.now(); playing = true; $('playBtn').textContent = 'Pause';
    raf = requestAnimationFrame(tick);
  }, 90);
}
function drawPhases() {
  const T = scene.T, host = $('phases'); host.innerHTML = '';
  const marks = [['Lift', T.lift0], ['Scan', T.scan0], ['Lock', T.lock0]];
  if (scene.o.ending !== 'cut') marks.push([scene.o.ending === 'zoom' ? 'Zoom' : 'Flash', T.out0]);
  marks.forEach(m => { const s = document.createElement('span'); s.textContent = m[0]; s.style.left = (m[1] / T.end * 100) + '%'; host.appendChild(s); });
}
function tick(ts) {
  if (!scene) return;
  if (playing) {
    const dur = scene.end + 0.5, el = ((ts - playT0) / 1000 + playOffset) % dur, tt = Math.min(el, scene.end);
    drawFrame(pctx, scene, tt);
    $('scrub').value = Math.round(tt / scene.end * 1000); paintRange($('scrub'));
  }
  raf = requestAnimationFrame(tick);
}
$('playBtn').onclick = () => {
  if (!scene) return;
  if (playing) { playing = false; $('playBtn').textContent = 'Play'; }
  else { playOffset = $('scrub').value / 1000 * scene.end; playT0 = performance.now(); playing = true; $('playBtn').textContent = 'Pause'; }
};
$('scrub').oninput = () => {
  if (!scene) return;
  playing = false; $('playBtn').textContent = 'Play'; paintRange($('scrub'));
  drawFrame(pctx, scene, $('scrub').value / 1000 * scene.end);
};
['place', 'ending', 'speed', 'frame'].forEach(id => $(id).addEventListener('change', refreshPreview));
$('round').addEventListener('input', () => { $('roundOut').textContent = $('round').value + '%'; paintRange($('round')); remember('round', +$('round').value); refreshPreview(); });
$('labelOn').addEventListener('change', () => { $('labelRow').hidden = !$('labelOn').checked; refreshPreview(); });
$('labelText').addEventListener('input', refreshPreview);

function showTab(which) {
  const vid = which === 'vid';
  $('viewPrev').hidden = vid; $('viewVid').hidden = !vid;
  if (!vid) $('vid').pause(); else $('vid').play().catch(() => {});
}

/* ----------------------------------------------------------------- render */
const H264 = ['avc1.64002A', 'avc1.4D002A', 'avc1.42002A', 'avc1.640028', 'avc1.4D0028', 'avc1.420028'];
// isConfigSupported can say yes and the encoder still fail when it really starts ("Encoder initialization error"),
// so a setup is only used after it has encoded one real frame
async function worksForReal(cfg) {
  let enc = null, failed = false;
  try {
    enc = new VideoEncoder({ output: () => {}, error: () => { failed = true; } });
    enc.configure(cfg);
    const cv = new OffscreenCanvas(cfg.width, cfg.height);
    cv.getContext('2d').fillRect(0, 0, 8, 8);
    const f = new VideoFrame(cv, { timestamp: 0 });
    enc.encode(f, { keyFrame: true }); f.close();
    await Promise.race([enc.flush(), new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 5000))]);
    return !failed;
  } catch (e) { return false; }
  finally { try { if (enc && enc.state !== 'closed') enc.close(); } catch (x) { /* ignore */ } }
}
// best setup first: full size on the video chip, then in software, then looser settings, then a smaller size, then VP9
async function pickConfig(fps) {
  const sizes = [[OUT_W, 'avc'], [720, 'avc'], [OUT_W, 'vp9']];
  for (const [W, muxCodec] of sizes) {
    const H = Math.round(W * 16 / 9), bitrate = Math.round(W * H * fps * OUT_QUALITY);
    const codecs = muxCodec === 'avc' ? H264 : ['vp09.00.41.08', 'vp09.00.40.08'];
    for (const hw of ['prefer-hardware', 'no-preference', 'prefer-software']) for (const codec of codecs) for (const loose of [false, true]) {
      const cfg = { codec, width: W, height: H, bitrate, framerate: fps, hardwareAcceleration: hw };
      if (muxCodec === 'avc' && !loose) { cfg.bitrateMode = 'variable'; cfg.avc = { format: 'avc' }; }
      try {
        const r = await VideoEncoder.isConfigSupported(cfg);
        if (r.supported && await worksForReal(r.config)) return { cfg: r.config, muxCodec };
      } catch (e) { /* try the next one */ }
    }
  }
  return null;
}
const yieldUI = () => new Promise(r => setTimeout(r, 0));
// sleeps until the encoder has finished a frame (a tight loop here starves the encoder's own callbacks)
const nextDequeue = enc => new Promise(r => {
  let done = false;
  const fin = () => { if (!done) { done = true; enc.removeEventListener('dequeue', fin); r(); } };
  enc.addEventListener('dequeue', fin); setTimeout(fin, 40);
});

// For browsers without WebCodecs (older Safari, Firefox) or computers whose encoder will not start:
// records the canvas live with MediaRecorder instead. Takes as long as the clip, and the tab must stay visible.
async function recordVideo(S, W, H, fps) {
  if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) throw new Error('This browser cannot make videos. Use a recent Chrome, Edge, Firefox or Safari.');
  const type = ['video/mp4;codecs=avc1.640028', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d', { alpha: false });
  drawFrame(c, S, 0);
  const rec = new MediaRecorder(cv.captureStream(fps), type ? { mimeType: type, videoBitsPerSecond: Math.round(W * H * fps * OUT_QUALITY) } : {});
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise((res, no) => { rec.onstop = res; rec.onerror = e => no((e && e.error) || new Error('The recorder failed.')); });
  rec.start(250);
  const t0 = performance.now();
  for (;;) {
    const t = (performance.now() - t0) / 1000;
    if (cancelFlag) { try { rec.stop(); } catch (x) { /* ignore */ } throw new Error('cancelled'); }
    drawFrame(c, S, Math.min(t, S.end));
    $('barFill').style.width = (Math.min(1, t / S.end) * 100).toFixed(1) + '%';
    $('progTxt').textContent = 'Recording  -  about ' + Math.max(0, Math.ceil(S.end - t)) + ' s left (keep this tab open)';
    if (t >= S.end) break;
    await new Promise(r => { const id = setTimeout(r, 60); requestAnimationFrame(() => { clearTimeout(id); r(); }); });
  }
  await new Promise(r => setTimeout(r, 150));
  rec.stop(); await stopped;
  const mime = rec.mimeType || type || 'video/webm';
  return { blob: new Blob(chunks, { type: mime }), ext: mime.indexOf('mp4') >= 0 ? 'mp4' : 'webm' };
}

async function render() {
  if (!img || !mark || rendering) return;
  $('err').textContent = '';
  if (typeof VideoEncoder === 'undefined' && !window.MediaRecorder) { $('err').textContent = 'This browser cannot make videos. Use a recent Chrome, Edge, Firefox or Safari.'; return; }
  rendering = true; cancelFlag = false;
  $('startBtn').disabled = true; $('cancelBtn').hidden = false; $('prog').hidden = false;
  playing = false; $('playBtn').textContent = 'Play';
  const fps = +val('fps');
  let encoder = null;
  try {
    $('progTxt').textContent = 'Getting the video encoder ready...';
    let blob = null, ext = 'mp4', W = OUT_W, H = Math.round(OUT_W * 16 / 9), n = 0, how = 'recorder';
    const st = { draw: 0, frame: 0, wait: 0 };
    const t0 = performance.now();
    const pick = typeof VideoEncoder !== 'undefined' ? await pickConfig(fps) : null;
    if (pick) {
      try {
        const cfg = pick.cfg; W = cfg.width; H = cfg.height; how = cfg.hardwareAcceleration;
        const S = prepare(W, H, options());
        n = Math.max(2, Math.round(S.end * fps));
        const target = new Mp4Muxer.ArrayBufferTarget();
        const muxer = new Mp4Muxer.Muxer({ target, video: { codec: pick.muxCodec, width: W, height: H, frameRate: fps }, fastStart: 'in-memory' });
        let encError = null;
        encoder = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => { encError = e; } });
        encoder.configure(cfg);
        const cv = new OffscreenCanvas(W, H), c = cv.getContext('2d', { alpha: false });
        const keyEvery = fps * 2, us = 1e6 / fps;
        for (let i = 0; i < n; i++) {
          if (cancelFlag) throw new Error('cancelled');
          if (encError) throw encError;
          const a0 = performance.now();
          drawFrame(c, S, Math.min(i / fps, S.end));
          const a1 = performance.now(); st.draw += a1 - a0;
          const frame = new VideoFrame(cv, { timestamp: Math.round(i * us), duration: Math.round(us) });
          encoder.encode(frame, { keyFrame: i % keyEvery === 0 });
          frame.close();
          const a2 = performance.now(); st.frame += a2 - a1;
          while (encoder.encodeQueueSize > 6) await nextDequeue(encoder);
          st.wait += performance.now() - a2;
          if (i % 8 === 7 || i === n - 1) {
            const done = (i + 1) / n, el = (performance.now() - t0) / 1000;
            $('barFill').style.width = (done * 100).toFixed(1) + '%';
            $('progTxt').textContent = 'Frame ' + (i + 1) + ' of ' + n + '  -  about ' + Math.max(0, Math.ceil(el / done - el)) + ' s left';
            await yieldUI();
          }
        }
        if (encError) throw encError;
        await encoder.flush(); encoder.close(); encoder = null;
        muxer.finalize();
        blob = new Blob([target.buffer], { type: 'video/mp4' });
      } catch (e) {
        if (e && e.message === 'cancelled') throw e;
        // the encoder broke part-way: fall through to the live recorder
        try { if (encoder && encoder.state !== 'closed') encoder.close(); } catch (x) { /* ignore */ }
        encoder = null; blob = null; how = 'recorder';
      }
    }
    if (!blob) {
      W = OUT_W; H = Math.round(W * 16 / 9);
      const S = prepare(W, H, options());
      n = Math.round(S.end * fps);
      ({ blob, ext } = await recordVideo(S, W, H, fps));
    }
    if (resultUrl) URL.revokeObjectURL(resultUrl);
    resultUrl = URL.createObjectURL(blob);
    $('vid').src = resultUrl; $('dl').href = resultUrl; $('dl').download = 'qr-scan-' + fps + 'fps.' + ext;
    $('meta').textContent = W + 'x' + H + '  -  ' + fps + ' fps  -  ' + (blob.size / 1048576).toFixed(1) + ' MB  -  made in ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s';
    window.__qr.stats = { draw: Math.round(st.draw), frame: Math.round(st.frame), wait: Math.round(st.wait), frames: n, hw: how };
    $('tabs').querySelector('[data-v="vid"]').disabled = false; setTab('vid'); showTab('vid');
  } catch (e) {
    if (e && e.message !== 'cancelled') $('err').textContent = 'The video could not be made: ' + (e.message || e);
    try { if (encoder && encoder.state !== 'closed') encoder.close(); } catch (x) { /* ignore */ }
  }
  rendering = false; $('prog').hidden = true; $('cancelBtn').hidden = true; $('startBtn').disabled = !(img && mark);
  playT0 = performance.now(); playOffset = 0; playing = true; $('playBtn').textContent = 'Pause';
}
$('startBtn').onclick = render;
$('cancelBtn').onclick = () => { cancelFlag = true; };

if (typeof VideoEncoder === 'undefined' && !window.MediaRecorder) $('err').textContent = 'This browser cannot make videos. Use a recent Chrome, Edge, Firefox or Safari.';
window.__qr = {
  loadBlob, render,
  setMark: m => { mark = m; $('fitBtn').disabled = false; $('clearBtn').disabled = false; drawMark(); refreshPreview(); },
  fit: m => fitMark(m || mark), getMark: () => mark
};
})();
</script>
